# Werkplekinspectie op k3s. Geen namespace: kies die zelf met `kubectl -n <namespace> apply -f`.
# Vereist: Secret `werkplekinspectie` (secret.example.yaml), ConfigMap `werkplekinspectie`
# (configmap.example.yaml) en, voor het logo, ConfigMap `werkplekinspectie-branding`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: werkplekinspectie
  labels:
    app.kubernetes.io/name: werkplekinspectie
spec:
  # Precies één replica: de rate limits en de lijst met al verstuurde inzendingen staan in het
  # geheugen van de pod. Met meer replica's krijgt elke pod zijn eigen tellers en lijst.
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate, geen RollingUpdate: tijdens een rolling update draaien er even twee pods, elk met
  # een eigen lijst van verstuurde inzendingen, dus kan een herhaalde poging een tweede mail
  # geven. Recreate stopt eerst de oude pod; een update geeft dan een paar seconden geen service.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: werkplekinspectie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: werkplekinspectie
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # De gebruiker `node` uit het image; numeriek zodat Kubernetes runAsNonRoot kan controleren.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: werkplekinspectie
          image: ghcr.io/silkepilon/werkplekinspectie:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: werkplekinspectie
            - configMapRef:
                name: werkplekinspectie
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            # Een inzending van 11 MB kost ongeveer 50 MB geheugen; de server verwerkt er
            # maximaal 2 tegelijk (daarna 429), met ruimte voor pieken in pdfkit.
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # Het rootfilesystem is read-only; pdfkit/nodemailer kunnen hier tijdelijk schrijven.
            - name: tmp
              mountPath: /tmp
            # Het logo uit ConfigMap `werkplekinspectie-branding` (sleutel logo.svg) staat dan
            # op /config/logo.svg; zie BRAND_LOGO_FILE in de ConfigMap.
            - name: branding
              mountPath: /config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: branding
          configMap:
            name: werkplekinspectie-branding
            # Zonder logo: laat deze ConfigMap weg én haal BRAND_LOGO_FILE uit de ConfigMap.
            optional: true
