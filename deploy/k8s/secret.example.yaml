# VOORBEELD. Zet hier nooit echte waarden in Git. Maak de echte Secret liever met
# `kubectl create secret generic werkplekinspectie --from-literal=...` (zie README),
# of kopieer dit bestand buiten de repo en vul het daar in.
apiVersion: v1
kind: Secret
metadata:
  name: werkplekinspectie
type: Opaque
stringData:
  # Ontvanger van de inspecties (precies één adres).
  MAIL_TO: "vgm@example.com"
  # Afzender, op een domein dat in Resend geverifieerd is.
  MAIL_FROM: "Werkplekinspectie <inspectie@example.com>"
  # Resend via SMTP: poort 465 met TLS, gebruiker `resend`, wachtwoord = Resend API-key.
  SMTP_HOST: "smtp.resend.com"
  SMTP_PORT: "465"
  SMTP_SECURE: "true"
  SMTP_USER: "resend"
  SMTP_PASS: "re_xxx"
